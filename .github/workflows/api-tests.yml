```yaml
name: API Tests - REST Assured

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run REST Assured tests
        run: mvn clean test
        working-directory: ./RestAssured/projeto01/restassured

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-test-results
          path: ./RestAssured/projeto01/restassured/target/surefire-reports/
```

